<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; background: #FFFDE7; color: #1a1a1a; min-height: 100vh; overflow-x: hidden; }

#opening {
  position: fixed; inset: 0; z-index: 100;
  background: #FFD700;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  transition: opacity 0.6s ease;
  cursor: pointer;
}
#opening.hide { opacity: 0; pointer-events: none; }
#opening canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#op-title {
  position: relative; z-index: 2; text-align: center;
  opacity: 0; animation: fadeInTitle 1.2s ease 1.8s forwards;
}
#op-title h1 { font-size: 22px; font-weight: 700; color: #7B4800; letter-spacing: 0.12em; line-height: 1.6; }
#op-title .sub { font-size: 13px; color: #9B6200; margin-top: 6px; letter-spacing: 0.08em; }
#op-start {
  position: relative; z-index: 2; margin-top: 28px;
  background: rgba(255,255,255,0.45); border: 2px solid rgba(123,72,0,0.4);
  border-radius: 30px;
  font-size: 13px; font-weight: 600; color: #7B4800;
  padding: 11px 36px; cursor: pointer; font-family: inherit;
  letter-spacing: 0.15em;
  box-shadow: 0 4px 16px rgba(0,0,0,0.10);

}

@keyframes fadeInTitle { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

#app { display: none; }
#app.show { display: block; }

.header { background: #B8860B; color: #fff; padding: 8px 14px 6px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.05em; }
.header .year { font-size: 13px; opacity: 0.8; }

.month-slider-wrap { background: #FFF8DC; border-bottom: 2px solid #DAA520; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.month-slider-wrap::-webkit-scrollbar { display: none; }
.month-slider { display: flex; padding: 6px 10px; gap: 6px; min-width: max-content; }
.month-btn { padding: 4px 12px; border-radius: 20px; border: 1.5px solid #DAA520; background: #FFFACD; font-size: 13px; font-weight: 600; cursor: pointer; color: #7B4800; white-space: nowrap; transition: transform 0.1s; }
.month-btn.active { background: #B8860B; border-color: #B8860B; color: #fff; }
.month-btn:active { transform: scale(0.93); }

.content { padding: 8px 12px 64px; max-width: 480px; margin: 0 auto; background: #FFFDE7; min-height: 100vh; }

.sanpai-card { position: relative; background: #FFFDE7; border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; border-left: 4px solid #c0392b; box-shadow: 0 1px 4px rgba(184,134,11,0.15); }
.sanpai-card .label { font-size: 12px; color: #B8860B; letter-spacing: 0.06em; margin-bottom: 2px; font-weight: 700; }
.sanpai-card .event { display: block; font-size: 18px; font-weight: 700; color: #7B4800; }
.sanpai-card .date-row { display: block; margin-top: 2px; font-size: 26px; font-weight: 700; color: #1a1a1a; line-height: 1.25; }
.sanpai-card .date-row .sat { color: #2e8b3e; }   /* 土曜日は緑（曜日の部分だけ） */

.sanpai-card .hol-name { font-size: 13px; margin-left: 6px; vertical-align: middle; }

.section-title { font-size: 12px; font-weight: 700; color: #B8860B; letter-spacing: 0.08em; margin: 8px 0 4px; }

.item-card { background: #FFFDE7; border-radius: 8px; padding: 6px 12px; margin-bottom: 4px; box-shadow: 0 1px 3px rgba(184,134,11,0.12); border: 1px solid #F0E68C; display: flex; align-items: center; justify-content: space-between; transition: transform 0.1s; }
.item-card:active { transform: scale(0.98); }
.item-card.ireisai .item-name { color: #1a6bbf; font-weight: 700; }
.item-left { flex: 1; display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 8px; }
.item-name { font-size: 14px; font-weight: 600; color: #5C3A00; }

/* 年の切り替え */
.year-nav { display: flex; align-items: center; gap: 4px; }
.year-nav button { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); color: #fff; border-radius: 12px; font-size: 12px; padding: 2px 9px; font-family: inherit; cursor: pointer; }
.year-nav button:disabled { opacity: 0.3; }
.header .year { font-size: 14px; font-weight: 700; opacity: 1; min-width: 52px; text-align: center; }
.tentative-mark { font-size: 10px; color: #999; margin-left: 6px; font-weight: 600; }
/* バックアップ */

.backup-row span { margin-right: auto; }
.backup-row button { font-size: 12px; font-weight: 600; padding: 5px 14px; border-radius: 14px; border: 1.5px solid #DAA520; background: #FFF8DC; color: #7B4800; font-family: inherit; cursor: pointer; }
.backup-form { scroll-margin-bottom: 70px; margin-top: 10px; background: #FFF8DC; border: 1.5px solid #DAA520; border-radius: 10px; padding: 8px 10px; }
.backup-form label { display: block; font-size: 12px; color: #7B4800; font-weight: 600; margin-bottom: 4px; }
.backup-form .name-wrap { display: flex; align-items: center; gap: 4px; }
.backup-form input { flex: 1; min-width: 0; font-size: 16px; padding: 6px 8px; border: 1.5px solid #DAA520; border-radius: 8px; background: #fff; font-family: inherit; color: #1a1a1a; }
.backup-form .ext { font-size: 13px; color: #9B6200; }
#toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: rgba(60,40,0,0.88); color: #fff; font-size: 13px; padding: 8px 18px; border-radius: 18px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 50; white-space: nowrap; }
#toast.show { opacity: 1; }
/* 参拝の編集 */
.edit-btn { position: absolute; top: 6px; right: 8px; background: #FFF3C4; border: 1px solid #DAA520; color: #7B4800; border-radius: 14px; font-size: 12px; font-weight: 600; padding: 3px 10px; font-family: inherit; cursor: pointer; }
.edited-mark { font-size: 10px; color: #c0392b; margin-left: 6px; font-weight: 600; }
.edit-form { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; margin-top: 4px; }
.edit-form label { font-size: 12px; color: #7B4800; font-weight: 600; }
.edit-form input { font-size: 16px; padding: 6px 8px; border: 1.5px solid #DAA520; border-radius: 8px; background: #fff; font-family: inherit; width: 100%; color: #1a1a1a; }
.edit-actions { grid-column: 1 / -1; display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; }
.edit-actions button { font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 16px; font-family: inherit; cursor: pointer; border: 1.5px solid #B8860B; background: #fff; color: #7B4800; }
.edit-actions .save { background: #B8860B; color: #fff; }
.edit-actions .reset { border-color: #bbb; color: #888; margin-right: auto; }
.header-left { display: flex; align-items: center; min-width: 0; }

/* === Claude Code のキャラクター（ヘッダー左上） === */
.cc-wrap { width: 62px; height: 40px; flex-shrink: 0; display: flex; justify-content: center; }
.cc-mascot { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; padding-top: 4px; }
.cc-mascot svg { width: 36px; height: 27px; shape-rendering: crispEdges; overflow: visible; transform-origin: center; }
/* 歩く・立ち止まる・手足の動きは、下のスクリプト（ccMascot）で1コマずつ動かしている */
.cc-mascot .cc-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: #fff; opacity: 0.9; white-space: nowrap; }
.cc-body { fill: #d97757; }
.cc-eye { fill: #1a1612; transform-box: fill-box; transform-origin: center; }
/* ときどきまばたき */
.cc-eye { animation: cc-blink 4s infinite; }
@keyframes cc-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }

<body>

<div id="opening">
  <canvas id="op-canvas"></canvas>
  <div id="op-title">

<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="cc-wrap">
        <a class="cc-mascot" href="https://claude.com/claude-code" target="_blank" rel="noopener" title="Claude Code で作成" aria-label="Claude Code で作成">

            <g class="cc-hop">
              <rect class="cc-body" x="2" y="0" width="8" height="6"/>
              <rect class="cc-body cc-arm-l" x="0" y="2" width="2" height="2"/>

<script>
/* ===== Web Audio ===== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(type, freq, delay, dur, vol) {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type; osc.frequency.value = freq;
  const t = audioCtx.currentTime + delay;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol||0.2, t+0.03);
  gain.gain.exponentialRampToValueAtTime(0.001, t+dur);
  osc.start(t); osc.stop(t+dur);
}

// オープニングチャイム
function playOpeningSound() {
  ensureAudio();
  [523.25,659.25,783.99,1046.50,880,1046.50,1318.51].forEach((f,i)=>playTone('sine',f,i*0.18,1.2,0.25));
  [1500,1800,2100,1700,2000].forEach((f,i)=>playTone('sine',f,0.9+i*0.12,0.6,0.12));
}

// メイン画面表示音（清らかなベル2音）
function playAppStartSound() {
  ensureAudio();
  playTone('sine', 880,  0.0, 0.8, 0.18);
  playTone('sine', 1320, 0.15, 0.7, 0.14);
  playTone('sine', 1760, 0.3,  0.6, 0.10);
}

// 月切り替え音（コツンと軽快）
function playMonthSound(month) {
  ensureAudio();
  // 月が大きくなるほど音程が上がる
  const baseFreq = 300 + month * 40;
  playTone('triangle', baseFreq, 0, 0.18, 0.18);
  playTone('sine', baseFreq * 1.5, 0.04, 0.14, 0.10);
}

// 参拝カード表示音（チリン）
function playSanpaiSound() {
  ensureAudio();
  playTone('sine', 1047, 0.0, 0.5, 0.15);
  playTone('sine', 1319, 0.08, 0.4, 0.10);
  playTone('sine', 1568, 0.16, 0.35, 0.08);
}

/* ===== オープニング アニメ ===== */
const opCanvas = document.getElementById('op-canvas');
const octx = opCanvas.getContext('2d');
let opFrame = 0, opRunning = true;

function resizeOp() { opCanvas.width=opCanvas.offsetWidth; opCanvas.height=opCanvas.offsetHeight; }
resizeOp(); window.addEventListener('resize', resizeOp);

class Angel {
  constructor() { this.reset(); this.y=Math.random()*(opCanvas.height||600); this.age=Math.random()*200; }
  reset() {
    const W=opCanvas.width||380, H=opCanvas.height||600;
    this.x=W*0.1+Math.random()*W*0.8; this.baseX=this.x; this.y=H+60;
    this.vy=-(1.2+Math.random()*1.0); this.vx=(Math.random()-0.5)*0.6;
    this.age=0; this.life=300+Math.random()*150; this.size=28+Math.random()*18;
    this.angle=(Math.random()-0.5)*0.3; this.spin=(Math.random()-0.5)*0.012;
    this.swayAmp=18+Math.random()*22; this.swayFreq=0.018+Math.random()*0.012;
    this.glitter=Math.random()*Math.PI*2;
  }
  update() {
    this.age++; this.y+=this.vy;
    this.x=this.baseX+Math.sin(this.age*this.swayFreq)*this.swayAmp;
    this.baseX+=this.vx; this.angle+=this.spin; this.glitter+=0.08;
    if(this.age>this.life||this.y<-80) this.reset();
  }
  draw(c) {
    const alpha=this.age<30?this.age/30:this.age>this.life-40?(this.life-this.age)/40:1;
    c.save(); c.globalAlpha=alpha*0.92; c.translate(this.x,this.y); c.rotate(this.angle);
    const s=this.size;
    c.beginPath(); c.ellipse(0,-s*0.95,s*0.38,s*0.10,0,0,Math.PI*2);
    c.strokeStyle='#FFE066'; c.lineWidth=s*0.07; c.stroke();
    c.save(); c.scale(-1,1); drawWing(c,s); c.restore(); drawWing(c,s);
    c.beginPath(); c.ellipse(0,s*0.15,s*0.22,s*0.38,0,0,Math.PI*2); c.fillStyle='#FFF8E7'; c.fill();
    c.beginPath(); c.arc(0,-s*0.52,s*0.20,0,Math.PI*2); c.fillStyle='#FFE4B5'; c.fill();
    c.fillStyle='#7B4800';
    c.beginPath(); c.arc(-s*0.07,-s*0.54,s*0.035,0,Math.PI*2); c.fill();
    c.beginPath(); c.arc( s*0.07,-s*0.54,s*0.035,0,Math.PI*2); c.fill();
    c.beginPath(); c.arc(0,-s*0.48,s*0.07,0.2,Math.PI-0.2);
    c.strokeStyle='#7B4800'; c.lineWidth=s*0.03; c.stroke();
    const kr=s*0.7;
    for(let k=0;k<4;k++){
      const ka=this.glitter+k*Math.PI/2;
      const kx=Math.cos(ka)*kr*(0.5+0.5*Math.sin(this.glitter*2+k));
      const ky=Math.sin(ka)*kr*0.5;
      const ks=s*0.06*(0.6+0.4*Math.sin(this.glitter+k));
      c.globalAlpha=alpha*0.7*(0.5+0.5*Math.sin(this.glitter*3+k));
      c.fillStyle='#FFFFFF'; drawStar4(c,kx,ky,ks);
    }
    c.restore();
  }
}
function drawWing(c,s){
  c.save(); c.beginPath();
  c.moveTo(s*0.12,-s*0.25);
  c.bezierCurveTo(s*0.55,-s*0.55,s*0.75,-s*0.15,s*0.55,s*0.15);
  c.bezierCurveTo(s*0.35,s*0.30,s*0.18,s*0.10,s*0.12,-s*0.05);
  c.closePath(); c.fillStyle='rgba(255,255,240,0.88)';
  c.strokeStyle='rgba(230,200,100,0.5)'; c.lineWidth=s*0.025;
  c.fill(); c.stroke(); c.restore();
}
function drawStar4(c,x,y,r){
  c.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2===0?r:r*0.4;i===0?c.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}
  c.closePath(); c.fill();
}
class Feather {
  constructor(){this.reset();this.y=Math.random()*(opCanvas.height||600);}
  reset(){
    this.x=Math.random()*(opCanvas.width||380);this.y=-20;
    this.size=4+Math.random()*6;this.vx=(Math.random()-0.5)*1.2;this.vy=0.5+Math.random()*0.8;
    this.angle=Math.random()*Math.PI*2;this.spin=(Math.random()-0.5)*0.04;
    this.alpha=0.4+Math.random()*0.4;this.life=0;this.maxLife=400+Math.random()*200;
  }
  update(){
    this.x+=this.vx+Math.sin(this.life*0.02)*0.5;this.y+=this.vy;
    this.angle+=this.spin;this.life++;
    if(this.y>(opCanvas.height||600)+20||this.life>this.maxLife)this.reset();
  }
  draw(c){
    c.save();c.globalAlpha=this.alpha*Math.min(1,(this.maxLife-this.life)/40);
    c.translate(this.x,this.y);c.rotate(this.angle);
    c.beginPath();c.ellipse(0,0,this.size*0.3,this.size,0,0,Math.PI*2);
    c.fillStyle='rgba(255,255,230,0.8)';c.fill();c.restore();
  }
}

const angels=Array.from({length:5},()=>new Angel());
const feathers=Array.from({length:20},()=>new Feather());

function opLoop(){
  if(!opRunning)return;
  const W=opCanvas.width,H=opCanvas.height;
  octx.clearRect(0,0,W,H);
  octx.fillStyle='#FFD700';octx.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2;
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2+opFrame*0.002;
    octx.save();octx.beginPath();octx.moveTo(cx,cy);
    octx.lineTo(cx+Math.cos(a)*W,cy+Math.sin(a)*W);
    octx.lineTo(cx+Math.cos(a+Math.PI/16)*W,cy+Math.sin(a+Math.PI/16)*W);
    octx.closePath();octx.fillStyle='rgba(255,240,100,0.18)';octx.fill();octx.restore();
  }
  feathers.forEach(f=>{f.update();f.draw(octx);});
  angels.forEach(a=>{a.update();a.draw(octx);});
  opFrame++;requestAnimationFrame(opLoop);
}
opLoop();

// 画面のどこをタップしても始まる（チャイムはタップした時に鳴らす）
document.getElementById('opening').addEventListener('click',function(){
  if(!opRunning) return;
  playOpeningSound();
  finishOpening();
});

function finishOpening(){
  opRunning=false;
  const op=document.getElementById('opening');
  op.classList.add('hide');
  setTimeout(()=>{
    op.style.display='none';
    document.getElementById('app').classList.add('show');
    playAppStartSound();
    initApp();
  },600);
}

/* ===== メインアプリ ===== */
const SANPAI_EVENTS={
  1: [{date:'1月3日（土）', name:'新年祭'}],
  2: [{date:'2月3日（火）', name:'MC'}],
  3: [{date:'3月3日（火）', name:'降誕祭'}],
  4: [{date:'4月3日（金）', name:'MC'}],
  5: [{date:'5月1日（金）', name:'MC'}],
  6: [{date:'6月15日（月）',name:'地上天国祭 Ufes'}],
  7: [{date:'7月3日（金）', name:'MC'}],
  8: [{date:'8月1日（土）',name:'平和祈願祭'}],
  9: [{date:'9月4日（金）',name:'MC'}],
  10:[{date:'10月2日（金）',name:'MC'}],
  11:[{date:'11月3日（火）',name:'MC'}],
  12:[{date:'12月4日（金）',name:'感謝祭'},{date:'12月23日（水）',name:'御生誕祭'}],
};
const BASE_ITEMS=[
  {key:'sanpai_rei',name:'参拝御礼',      amount:1000,sub:'',                        ireisai:false},
  {key:'kansha',    name:'感謝献金',        amount:1000,sub:'',                        ireisai:false},
  {key:'kensetsu',  name:'建設献金',        amount:1000,sub:'',                        ireisai:false},
  {key:'kaihi',     name:'会費',            amount:4000,sub:'住友博・住友芳美・住友正',ireisai:false},
  {key:'mo_sanpai', name:'MOランド参拝',    amount:5000,sub:'',                        ireisai:false},
  {key:'irei_ie',   name:'慰霊祭（家）',    amount:2000,sub:'住友家',                  ireisai:true},
  {key:'irei_kojin',name:'慰霊祭（個人）',  amount:2000,sub:'住友勇蔵・住友ハツ',      ireisai:true},
  {key:'irei_kami', name:'慰霊祭（神様）',  amount:1000,sub:'',                        ireisai:true},
  {key:'irei_sorei',name:'慰霊祭（祖霊様）',amount:1000,sub:'',                        ireisai:true},
];

/* ===== 参拝の変更（スマホ内に保存） ===== */
const BASE_YEAR=2026;
const KEY_PREFIX='sanpai_overrides_';
let currentYear=Math.max(BASE_YEAR, new Date().getFullYear());
function loadOverrides(y){ try{ return JSON.parse(localStorage.getItem(KEY_PREFIX+y))||{}; }catch(e){ return {}; } }
function saveOverrides(o){ try{
  if(Object.keys(o).length) localStorage.setItem(KEY_PREFIX+currentYear, JSON.stringify(o));
  else localStorage.removeItem(KEY_PREFIX+currentYear);
}catch(e){} }
let overrides=loadOverrides(currentYear);
// 2027年以降は2026年と同じ月日を仮の予定にする（曜日は自動で計算）
function defaultEvents(month){
  const base=SANPAI_EVENTS[month]||[];
  if(currentYear===BASE_YEAR) return base;
  return base.map(ev=>({name:ev.name, date:formatDate(toIso(ev.date,month))}));
}
function getEvents(month){ return overrides[month] || defaultEvents(month); }
const WD=['日','月','火','水','木','金','土'];
function formatDate(iso){ // 2026-10-02 → 10月2日（金）
  const [y,m,d]=iso.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  return `${m}月${d}日（${WD[dt.getDay()]}）`;
}
function toIso(label, month){ // 10月2日（金） → 2026-10-02
  const r=/(\d+)月(\d+)日/.exec(label||'');
  const m=r?+r[1]:month, d=r?+r[2]:1;
  return `${currentYear}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===== 祝日の判定（日本の祝日・振替休日・国民の休日） ===== */
function nthMonday(y,m,n){ const first=new Date(y,m-1,1).getDay(); return 1+((8-first)%7)+(n-1)*7; }
function baseHoliday(y,m,d){
  const fixed={'1-1':'元日','2-11':'建国記念の日','2-23':'天皇誕生日','4-29':'昭和の日','5-3':'憲法記念日','5-4':'みどりの日','5-5':'こどもの日','8-11':'山の日','11-3':'文化の日','11-23':'勤労感謝の日'};
  if(fixed[m+'-'+d]) return fixed[m+'-'+d];
  if(m===1 && d===nthMonday(y,1,2)) return '成人の日';
  if(m===7 && d===nthMonday(y,7,3)) return '海の日';
  if(m===9 && d===nthMonday(y,9,3)) return '敬老の日';
  if(m===10 && d===nthMonday(y,10,2)) return 'スポーツの日';
  if(m===3 && d===Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4))) return '春分の日';
  if(m===9 && d===Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4))) return '秋分の日';
  return '';
}
function holidayName(y,m,d){
  const name=baseHoliday(y,m,d);
  if(name) return name;
  const dt=new Date(y,m-1,d);
  // 振替休日：祝日が日曜なら、その後の最初の祝日でない日
  for(let i=1;i<=6;i++){
    const p=new Date(y,m-1,d-i);
    if(!baseHoliday(p.getFullYear(),p.getMonth()+1,p.getDate())) break;
    if(p.getDay()===0) return '振替休日';
  }
  // 国民の休日：前後が祝日に挟まれた平日
  if(dt.getDay()!==0){
    const a=new Date(y,m-1,d-1), b=new Date(y,m-1,d+1);
    if(baseHoliday(a.getFullYear(),a.getMonth()+1,a.getDate()) && baseHoliday(b.getFullYear(),b.getMonth()+1,b.getDate())) return '国民の休日';
  }
  return '';
}
// 参拝日の表示：日付は黒のまま、曜日の部分だけ 土曜日は緑・祝日は紫（祝日が土曜なら紫）
function dateRowHtml(label, month){
  const [y,m,d]=toIso(label,month).split('-').map(Number);
  const hol=holidayName(y,m,d);
  const sat=new Date(y,m-1,d).getDay()===6;
  const cls=hol?'hol':(sat?'sat':'');
  const r=/^(.*?)(（.）)$/.exec(label);
  const datePart=r?r[1]:label, wdPart=r?r[2]:'';
  const wd=cls?`<span class="${cls}">${escapeHtml(wdPart)}</span>`:escapeHtml(wdPart);
  return `<span class="date-row">${escapeHtml(datePart)}${wd}${hol?`<span class="hol-name hol">${hol}</span>`:''}</span>`;
}

let editingIndex=-1;
let backupNaming=false;

let currentMonth=new Date().getMonth()+1;

function initApp(){
  updateYearLabel();
  const slider=document.getElementById('monthSlider');
  for(let m=1;m<=12;m++){
    const btn=document.createElement('button');
    btn.className='month-btn'+(m===currentMonth?' active':'');
    btn.dataset.month=m; btn.textContent=m+'月';
    slider.appendChild(btn);
  }
  render(currentMonth);
  setTimeout(()=>{
    const ab=document.querySelector('.month-btn.active');
    if(ab) ab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  },100);
}

function render(month, silent){
  const sanpaiList=getEvents(month);
  let html='';

  // 参拝カードがある月は音を鳴らす
  if(sanpaiList.length>0){
    if(!silent) setTimeout(()=>playSanpaiSound(), 200);
    const edited=!!overrides[month];
    sanpaiList.forEach((s,i)=>{
      if(i===editingIndex){
        html+=`<div class="sanpai-card">
          <div class="label">今月の参拝を変更</div>
          <div class="edit-form">
            <label for="ev-name">行事名</label><input id="ev-name" type="text" value="${escapeHtml(s.name)}">
            <label for="ev-date">日付</label><input id="ev-date" type="date" value="${toIso(s.date,month)}">
            <div class="edit-actions">
              ${edited?'<button class="reset" data-act="reset">元に戻す</button>':''}
              <button data-act="cancel">やめる</button>
              <button class="save" data-act="save" data-i="${i}">保存</button>
            </div>
          </div>
        </div>`;
      } else {
        html+=`<div class="sanpai-card">
          <div class="label">今月の参拝${edited?'<span class="edited-mark">変更済み</span>':(currentYear!==BASE_YEAR?'<span class="tentative-mark">仮の日付</span>':'')}</div>
          <div class="event">${escapeHtml(s.name)}</div>${dateRowHtml(s.date,month)}
          <button class="edit-btn" data-act="edit" data-i="${i}">✎ 変更</button>
        </div>`;
      }
    });
  } else {
    html+=`<div class="sanpai-card" style="border-left-color:#aaa">
      <div class="label">今月の参拝</div>
      <div class="event" style="color:#aaa">参拝予定なし</div>
    </div>`;
  }

  html+=`<div class="section-title">支払い一覧</div>`;
  BASE_ITEMS.forEach(item=>{
    html+=`<div class="item-card ${item.ireisai?'ireisai':''}">
      <div class="item-left">
        <div class="item-name">${item.name}</div>
        ${item.sub?`<div class="item-sub">${item.sub}</div>`:''}
      </div>
      <div class="item-amount">¥${item.amount.toLocaleString()}</div>
    </div>`;
  });

  if(backupNaming){
    html+=`<div class="backup-form">
      <label for="bk-name">バックアップの保存名</label>
      <div class="name-wrap"><input id="bk-name" type="text" value="${escapeHtml(defaultBackupName())}"><span class="ext">.json</span></div>
      <div class="edit-actions" style="margin-top:6px">
        <button data-act="bk-cancel">やめる</button>
        <button class="save" data-act="bk-save">この名前で保存</button>
      </div>
    </div>`;
  } else {
    html+=`<div class="backup-row"><span>バックアップ</span>
      <button data-act="backup">保存</button><button data-act="restore">復元</button></div>`;
  }
  document.getElementById('mainContent').innerHTML=html;

  // 合計は支払い一覧の金額から計算する
  const total=BASE_ITEMS.reduce((sum,item)=>sum+item.amount,0);
  document.getElementById('totalAmount').textContent='¥'+total.toLocaleString();
}

document.getElementById('monthSlider').addEventListener('click',function(e){
  const btn=e.target.closest('.month-btn');
  if(!btn) return;
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentMonth=parseInt(btn.dataset.month);
  editingIndex=-1;
  playMonthSound(currentMonth);
  render(currentMonth);
  btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
});

document.getElementById('mainContent').addEventListener('click',function(e){
  const b=e.target.closest('button[data-act]');
  if(!b) return;
  const act=b.dataset.act;
  if(act==='edit'){
    editingIndex=+b.dataset.i; render(currentMonth,true);
    const inp=document.getElementById('ev-name'); if(inp) inp.focus();
  } else if(act==='cancel'){
    editingIndex=-1; render(currentMonth,true);
  } else if(act==='save'){
    const name=document.getElementById('ev-name').value.trim();
    const iso=document.getElementById('ev-date').value;
    if(!name||!iso) return;
    const list=getEvents(currentMonth).map(x=>({...x}));
    list[+b.dataset.i]={name, date:formatDate(iso)};
    overrides[currentMonth]=list; saveOverrides(overrides);
    editingIndex=-1; playSanpaiSound(); render(currentMonth,true);
  } else if(act==='backup'){
    backupNaming=true; render(currentMonth,true);
    const inp=document.getElementById('bk-name');
    if(inp){ document.querySelector('.backup-form').scrollIntoView({block:'end'}); inp.focus(); inp.select(); }
  } else if(act==='bk-cancel'){
    backupNaming=false; render(currentMonth,true);
  } else if(act==='bk-save'){
    const name=cleanFileName(document.getElementById('bk-name').value);
    backupNaming=false; render(currentMonth,true);
    doBackup(name);
  } else if(act==='restore'){
    document.getElementById('restoreFile').click();
  } else if(act==='reset'){
    delete overrides[currentMonth]; saveOverrides(overrides);
    editingIndex=-1; render(currentMonth,true);
  }
});

/* ===== 年の切り替え ===== */
function updateYearLabel(){
  document.getElementById('headerYear').textContent=currentYear+'年';
  document.getElementById('yPrev').disabled=currentYear<=BASE_YEAR;
}
function changeYear(d){
  const y=currentYear+d;
  if(y<BASE_YEAR) return;
  currentYear=y; overrides=loadOverrides(y); editingIndex=-1;
  updateYearLabel(); playMonthSound(currentMonth); render(currentMonth,true);
}
document.getElementById('yPrev').addEventListener('click',()=>changeYear(-1));
document.getElementById('yNext').addEventListener('click',()=>changeYear(1));
document.getElementById('opYear').textContent=currentYear+'年';

/* ===== バックアップ（保存・復元） ===== */
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function collectData(){
  const years={};
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith(KEY_PREFIX)){
        const y=k.slice(KEY_PREFIX.length);
        try{ years[y]=JSON.parse(localStorage.getItem(k)); }catch(e){}
      }
    }
  }catch(e){}
  return {app:'sanpai-kensetsu', version:1, savedAt:new Date().toISOString(), years};
}
function defaultBackupName(){
  const d=new Date();
  return `参拝建設献金_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}
function cleanFileName(s){
  s=String(s||'').replace(/\.json$/i,'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'').trim();
  return (s||defaultBackupName())+'.json';
}
async function doBackup(name){
  const data=collectData();
  name=name||cleanFileName('');
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  // スマホ：共有メニュー（「ファイルに保存」やLINEなど）
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'参拝・建設献金 バックアップ'}); toast('バックアップを保存しました'); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  // パソコンなど：ダウンロード
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('バックアップを保存しました');
}
document.getElementById('restoreFile').addEventListener('change',function(){
  const f=this.files && this.files[0]; this.value='';
  if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{ data=JSON.parse(reader.result); }catch(e){ toast('読み込めないファイルです'); return; }
    if(!data || data.app!=='sanpai-kensetsu' || typeof data.years!=='object'){ toast('このアプリのバックアップではありません'); return; }
    try{
      const old=[];
      for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith(KEY_PREFIX)) old.push(k); }
      old.forEach(k=>localStorage.removeItem(k));
      Object.entries(data.years).forEach(([y,o])=>{ if(/^\d{4}$/.test(y) && o && typeof o==='object') localStorage.setItem(KEY_PREFIX+y, JSON.stringify(o)); });
    }catch(e){ toast('復元できませんでした'); return; }
    overrides=loadOverrides(currentYear); editingIndex=-1;
    render(currentMonth,true); playSanpaiSound();
    toast('バックアップから復元しました');
  };
  reader.readAsText(f);
});

// =============================================================
// Claude Code のキャラクター（ヘッダー左上）
//   右へ歩く → 端で立ち止まって手足をちょこちょこ動かし、振り向く → 左へ戻る … を繰り返す
// =============================================================
(function ccMascot() {
  const svg = document.querySelector('.cc-mascot svg');
  if (!svg) return;
  const body = svg.querySelector('.cc-hop');
  const armL = svg.querySelector('.cc-arm-l');
  const armR = svg.querySelector('.cc-arm-r');
  const legs = Array.from(svg.querySelectorAll('.cc-leg')); // 左から順に4本

  const HALF = 12;        // 真ん中から左右それぞれに歩く幅（px）
  const STEP = 2;         // 1歩で進む距離（px）
  const TICK = 220;       // 1コマの長さ（ミリ秒）
  const IDLE_TICKS = 9;   // 端で立ち止まるコマ数

  let x = -HALF, dir = 1, mode = 'idle', t = 0;

  const legUp = (i, up) => legs[i].setAttribute('height', up ? 1 : 2);
  const armUp = (el, up) => el.setAttribute('y', up ? 1 : 2);
  const bob = up => body.setAttribute('transform', up ? 'translate(0,-1)' : '');
  const rest = () => { legs.forEach((_, i) => legUp(i, false)); armUp(armL, false); armUp(armR, false); bob(false); };
  const draw = () => { svg.style.transform = `translateX(${x}px) scaleX(${dir})`; };

  function tick() {
    t++;
    if (mode === 'walk') {
      // 歩く：外側2本と内側2本の足を交互に上げ、体も小さく弾ませる
      const ph = t % 2;
      armUp(armL, false); armUp(armR, false);
      legUp(0, ph === 0); legUp(2, ph === 0);
      legUp(1, ph === 1); legUp(3, ph === 1);
      bob(ph === 0);
      x += STEP * dir;
      if (x <= -HALF || x >= HALF) {
        x = Math.max(-HALF, Math.min(HALF, x));
        mode = 'idle'; t = 0; rest();
      }
    } else {
      // 立ち止まり：両腕を交互に上げ下げし、端の足でトントンと足踏み
      const ph = t % 4;
      armUp(armL, ph === 1);
      armUp(armR, ph === 3);
      legUp(0, ph === 2);
      legUp(3, ph === 0);
      bob(false);
      if (t === Math.floor(IDLE_TICKS / 2)) dir = (x >= HALF) ? -1 : 1; // 途中で振り向く
      if (t >= IDLE_TICKS) { mode = 'walk'; t = 0; rest(); }
    }
    draw();
  }

  draw();
  setInterval(tick, TICK);
})();
</script>
